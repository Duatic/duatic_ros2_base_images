name: Release

# Dispatch opens the `release: X.Y.Z` pull request with the next CHANGELOG.rst section, the bump
# derived from the commits unless overridden. Merging it tags vX.Y.Z, publishes the GitHub Release
# and pushes the versioned images for every distro.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the bump derived from the commits'
        type: choice
        options: [derived, major, minor, patch]
        default: derived
      runner:
        description: 'Runner label(s) for the prepare job'
        type: string
        default: 'ubuntu-latest'
  pull_request:
    types: [closed]

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    uses: Duatic/ci-workflows/.github/workflows/reusable_prepare_changelog_release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'release:')
    permissions:
      contents: write
    uses: Duatic/ci-workflows/.github/workflows/reusable_changelog_release_tag.yml@v1

  # The tag workflow has no outputs, and a tag pushed with GITHUB_TOKEN starts no workflow, so the
  # version comes from the merged pull request's title.
  version:
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::cannot read a version from the title: $TITLE"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ros_distro: ${{ matrix.ros_distro }}
      push: true
      version: ${{ needs.version.outputs.version }}
