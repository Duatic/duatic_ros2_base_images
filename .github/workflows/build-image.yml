name: Build image (reusable)

# Reusable workflow: build (and optionally publish) one image target of the calling repository
# for a single ROS distro: dev, runtime (with a version, what release-image.yml uses),
# dev,runtime (both sharing one compile, what nightly.yml uses), or ci (the repository's
# workspace without the repository, which ci-workflows builds and tests on). See README.md for the architecture (stage graph, strict-vs-lenient dependency gate,
# dev's lean fallback).

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "ROS distro (humble|jazzy|kilted|lyrical|rolling)"
        required: true
        type: string
      target:
        description: "Image target(s) to build: dev, runtime, dev,runtime (one shared compile) or ci"
        required: false
        default: "runtime"
        type: string
      image_date:
        description: "Shared date tag (YYYY-MM-DD) for this run; blank = today"
        required: false
        default: ""
        type: string
      publish:
        description: "Push the built image to ghcr.io (otherwise build/load only)"
        required: false
        default: false
        type: boolean
      version:
        description: "Release version (target runtime or dev,runtime): tags each image :<distro>-<version> instead of the nightly tags, refuses an existing one, and with publish moves :<distro> to it"
        required: false
        default: ""
        type: string
      runner:
        description: "Runner label(s) for the build job"
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      GH_PAT:
        description: "GitHub token used by vcs import to clone private repositories; the caller's own token when unset"
        required: false
      DOCKERHUB_USERNAME:
        description: "Docker Hub user for authenticated (per-account rate-limited) pulls; anonymous when unset"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub access token (Public Repo Read-only scope)"
        required: false
    outputs:
      image:
        description: "Reference of the ci image (target ci) or the release image (target runtime with version)"
        value: ${{ jobs.build.outputs.image }}
      dev_image:
        description: "Reference of the release dev image (target dev,runtime with version)"
        value: ${{ jobs.build.outputs.dev_image }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    outputs:
      image: ${{ steps.build.outputs.image }}
      dev_image: ${{ steps.build.outputs.dev_image }}
    env:
      # Surfaced as env because the `secrets` context can't be read in a step-level `if`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Read by scripts/build_workspace.sh. Set here, not in the caller: workflow-level env is not
      # inherited through `uses:`.
      PARALLEL_WORKERS: "4"
      INNER_JOBS: "1"
    permissions:
      contents: read
      packages: write
    steps:
      # Not persisted: the checkout's .git goes into the image's build stages. build_workspace.sh
      # names the repository after the checkout's origin remote, not after this path.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          path: caller
          persist-credentials: false

      # The checkout above takes the calling repository. job.workflow_ref names this file's
      # own repository and revision, so a caller pinning this workflow pins the factory and,
      # through FACTORY_REF, the base images it builds on.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          # Also read by scripts/image_env.sh: picks the ros2-base / ros2-dev release to build on.
          echo "FACTORY_REF=${WORKFLOW_REF#*@}" >> "$GITHUB_ENV"

      - name: Checkout the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ env.FACTORY_REF }}
          path: factory

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ inputs.target }}
        id: build
        shell: bash
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          IMAGE_DATE: ${{ inputs.image_date }}
          VERSION: ${{ inputs.version }}
        run: |
          ARGS=(--source caller --ros-distro "${{ inputs.ros_distro }}" --target "${{ inputs.target }}")
          if [ "${{ inputs.publish }}" = "true" ]; then
            ARGS+=(--push)
          fi
          if [ -n "$VERSION" ]; then
            ARGS+=(--version "$VERSION")
          fi
          ./factory/scripts/build_workspace.sh "${ARGS[@]}"

      - name: Write dev/runtime badge artifact
        if: ${{ always() && inputs.publish && !inputs.version && contains(inputs.target, 'dev') && contains(inputs.target, 'runtime') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p badge
          render() {
            local kind="$1" result="$2"
            local message="failed" color="red"
            if [ "$result" = "success" ]; then
              message="${{ inputs.image_date }}"
              color="brightgreen"
            fi
            cat > "badge/${{ inputs.ros_distro }}-${kind}.json" <<EOF
          {"schemaVersion":1,"label":"","message":"${message}","color":"${color}"}
          EOF
          }
          render dev "${{ steps.build.outputs.dev_result }}"
          render runtime "${{ steps.build.outputs.runtime_result }}"

      - name: Upload dev/runtime badge artifact
        if: ${{ always() && inputs.publish && !inputs.version && contains(inputs.target, 'dev') && contains(inputs.target, 'runtime') }}
        uses: actions/upload-artifact@v7
        with:
          name: badge-${{ inputs.ros_distro }}
          path: badge/*.json
          retention-days: 1
