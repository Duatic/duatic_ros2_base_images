name: Nightly images

# Reusable workflow: nightly build of the calling repository's dev/runtime images, per ROS
# distro, published to ghcr.io/duatic/<repository without duatic_>, on top of this repository's
# ros2-base / ros2-dev images. See README.md for the architecture (stage graph,
# strict-vs-lenient dependency gate, dev's lean fallback, and why dev + runtime share one
# workspace compile).
#
# Each repository runs it on its own schedule, and its badges land on that repository's
# `image-badges` branch.

# Distros built when the caller gives none.
env:
  DEFAULT_DISTROS: "jazzy,kilted,lyrical,rolling"

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "Comma-separated distros to build, e.g. 'jazzy,kilted'. Empty builds DEFAULT_DISTROS."
        required: false
        default: ""
        type: string
      publish:
        description: "Push to ghcr.io and publish the badges"
        required: false
        default: false
        type: boolean
      architectures:
        description: 'JSON list of the architectures to build, of amd64 and arm64'
        required: false
        default: '["amd64","arm64"]'
        type: string
      runner:
        description: "Runner label(s) for the amd64 builds and every other job"
        required: false
        default: "ubuntu-latest"
        type: string
      runner_arm64:
        description: "Runner label(s) for the arm64 builds"
        required: false
        default: "ubuntu-24.04-arm"
        type: string
    secrets:
      GH_PAT:
        description: "GitHub token used by vcs import to clone private repositories"
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Runs queue rather than cancel: tags are pushed per cell, so cancelling midway leaves the
# matrix half-published with nothing to repair it. reusable_release_image.yml shares the group.
concurrency:
  group: duatic-image-publish
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ${{ inputs.runner }}
    outputs:
      distros: ${{ steps.gen.outputs.distros }}
      image_date: ${{ steps.gen.outputs.image_date }}
    steps:
      - id: gen
        shell: bash
        env:
          IN_DISTRO: ${{ inputs.ros_distro }}
          DEFAULT_DISTROS: ${{ env.DEFAULT_DISTROS }}
        run: |
          # Date for image tags (e.g. ghcr.io/duatic/<name>-dev:<distro>-<date>) and the ci key.
          echo "image_date=$(TZ=Europe/Zurich date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          # Split on commas, strip whitespace, drop empties -> a JSON array of distros.
          distros=$(jq -cR 'split(",") | map(gsub("\\s"; "")) | map(select(. != ""))' <<<"${IN_DISTRO:-$DEFAULT_DISTROS}")
          echo "distros=$distros" >> "$GITHUB_OUTPUT"
          echo "Distros: $distros"

  # Dev + runtime per distro, in one job (target: dev,runtime). Both use the shared workspace
  # (Dockerfile target workspace); build_workspace.sh compiles it once per job and reuses it.
  #
  # Dev's deps are resolved leniently and it always publishes (a lean one only as :<date>):
  # DUATIC_UNDERLAY (baked into the image) records whether the workspace actually compiled.
  # Runtime always requires a successful workspace build and fails the job if it didn't.
  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.distros != '[]' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.matrix.outputs.distros) }}
    uses: ./.github/workflows/reusable_build_image.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      target: dev,runtime
      image_date: ${{ needs.matrix.outputs.image_date }}
      publish: ${{ inputs.publish }}
      architectures: ${{ inputs.architectures }}
      runner: ${{ inputs.runner }}
      runner_arm64: ${{ inputs.runner_arm64 }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Delete the ci images built before today to save on disk space: their key holds an earlier
  # day, so nothing can reuse them.
  prune-ci:
    name: Prune ci images
    needs: build
    if: ${{ always() && inputs.publish }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - name: Delete ci images from before today
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/orgs/${OWNER}/packages/container/${REPO#duatic_}-ci/versions"
          today=$(TZ=Europe/Zurich date -d 'today 00:00' +%s)
          old=()
          for ((page = 1; ; page++)); do
            versions=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}?per_page=100&page=${page}")
            [[ $(jq length <<<"$versions") -gt 0 ]] || break
            mapfile -t -O "${#old[@]}" old < <(jq -r --argjson today "$today" \
              '.[] | select((.created_at | fromdateiso8601) < $today) | .id' <<<"$versions")
          done
          echo "Deleting ${#old[@]} ci image versions from before today."
          for id in "${old[@]}"; do
            curl -fsSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" "${api}/${id}"
          done

  # Coalesces every leg's badge artifact into a single commit on the image-badges branch.
  badges:
    name: Publish status badges
    needs: [matrix, build]
    if: ${{ always() && inputs.publish }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Download badge artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: badge-*
          path: badges
          merge-multiple: true

      - name: Publish badges to branch
        env:
          TOKEN: ${{ github.token }}
          DISTROS: ${{ needs.matrix.outputs.distros }}
        run: |
          set -euo pipefail
          src="$PWD/badges"
          mkdir out && cd out
          git init -q -b image-badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on the existing branch so badges of distros not built this run are kept
          if git fetch -q --depth=1 origin image-badges; then git reset -q --hard FETCH_HEAD; fi

          # A leg that never ran at all (e.g. skipped) uploaded nothing: it gets the same red
          # "failed" badge as a leg that ran and failed.
          render() { # <distro-kind>
            local f="$src/$1.json" message="failed" color="red"
            if [ -f "$f" ]; then
              message=$(jq -r .message "$f")
              color=$(jq -r .color "$f")
            fi
            curl -sSfG https://img.shields.io/static/v1 -o "$1.svg" \
              --data-urlencode "label=" \
              --data-urlencode "message=${message}" \
              --data-urlencode "color=${color}"
          }
          for d in $(jq -r '.[]' <<<"$DISTROS"); do
            render "$d-dev"
            render "$d-runtime"
          done

          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged, nothing to publish."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update image badges"
          git push -q origin HEAD:image-badges
