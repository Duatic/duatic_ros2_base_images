name: Release runtime image

# Reusable workflow: cuts an immutable, versioned runtime image of the calling repository for
# CUSTOMER robots, from the revision the caller runs on. Callers trigger it manually only: a
# release is a deliberate act, not a nightly side effect. See README.md for the
# full image-set/tag design (:edge/:<date> nightly vs. :<version>/:stable release) and
# scripts/build_workspace.sh --help for what --version actually does (immutability guard, tagging,
# :stable promotion).
#
# What this produces, given e.g. a call from duatic_dxtr with ros_distro=jazzy, version=1.0.0:
#   - ghcr.io/duatic/dxtr/jazzy-runtime:1.0.0   (immutable — refuses to overwrite)
#   - ghcr.io/duatic/dxtr/jazzy-runtime:stable  (moved to point at 1.0.0)
#   - git tag release/jazzy/1.0.0 on the calling repository
#   - a GitHub Release on that tag carrying the exact source pin (sources.lock.repos) and a
#     snapshot of what's actually installed (packages.txt, pip-freeze.txt, ros2-pkg-list.txt)
#
# The image is built by build-image.yml, like every other image; the release job only reads
# the pushed image back from the registry.
#
# Reproducing this exact build later (e.g. to rebuild on a patched base image without
# touching the repository's source): pull the image, extract /etc/duatic/sources.lock.repos (or grab
# it from the release assets), and pass it back in as
#   docker buildx build --target runtime --build-context sourceslock=<dir with that file> ...

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "ROS distro to release"
        required: true
        type: string
      version:
        description: "Version to tag (e.g. 1.0.0); must not already exist"
        required: true
        type: string
      runner:
        description: "Runner label(s) for both jobs"
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      GH_PAT:
        description: "GitHub token used by vcs import to clone private repositories"
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Shares nightly.yml's group so the two never race. Never cancelled: it pushes
# immutable :<version> tags and moves :stable.
concurrency:
  group: duatic-image-publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      target: runtime
      version: ${{ inputs.version }}
      publish: true
      runner: ${{ inputs.runner }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: build
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: release/${{ inputs.ros_distro }}/${{ inputs.version }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" cat /etc/duatic/sources.lock.repos > sources.lock.repos
          docker run --rm "$IMAGE" dpkg -l > packages.txt
          docker run --rm "$IMAGE" pip3 freeze > pip-freeze.txt
          docker run --rm "$IMAGE" bash -c \
            'source /opt/ros/$ROS_DISTRO/setup.bash && source /opt/duatic/ws/install/setup.bash && ros2 pkg list' \
            > ros2-pkg-list.txt
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > digest.txt
          echo "Digest: $(cat digest.txt)"

      # Tags the released revision of the calling repository.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${IMAGE#ghcr.io/duatic/}" \
            --notes "$(cat <<EOF
          Runtime image: \`${IMAGE}\` (also tagged \`:stable\`)
          Digest: $(cat digest.txt)
          Built from \`${GITHUB_REPOSITORY}\`@\`${GITHUB_SHA}\`

          Robots pin to \`${IMAGE}\` directly, or track \`${IMAGE%:*}:stable\`.
          Reproduce this exact build: extract \`sources.lock.repos\` below and pass it to
          \`docker buildx build --target runtime --build-context sourceslock=<dir>\`
          (see https://github.com/Duatic/duatic_ros2_base_images#releases-of-workspace-images).
          EOF
          )" \
            sources.lock.repos packages.txt pip-freeze.txt ros2-pkg-list.txt digest.txt
