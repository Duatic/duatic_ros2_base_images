name: Release runtime image

# Reusable workflow: cuts an immutable, versioned runtime image of the calling repository for
# CUSTOMER robots, from the revision the caller runs on. Callers trigger it manually only: a
# release is a deliberate act, not a nightly side effect. See README.md for the
# full image-set/tag design (:edge/:<date> nightly vs. :<version>/:stable release) and
# scripts/build_product.sh --help for what --version actually does (immutability guard, tagging,
# :stable promotion).
#
# What this produces, given e.g. a call from duatic_dxtr with ros_distro=jazzy, version=1.0.0:
#   - ghcr.io/duatic/dxtr/jazzy-runtime:1.0.0   (immutable — refuses to overwrite)
#   - ghcr.io/duatic/dxtr/jazzy-runtime:stable  (moved to point at 1.0.0)
#   - git tag release/jazzy/1.0.0 on the calling repository
#   - a GitHub Release on that tag carrying the exact source pin (sources.lock.repos) and a
#     snapshot of what's actually installed (packages.txt, pip-freeze.txt, ros2-pkg-list.txt)
#
# Reproducing this exact build later (e.g. to rebuild on a patched base image without
# touching product source): pull the image, extract /etc/duatic/sources.lock.repos (or grab
# it from the release assets), and pass it back in as
#   docker buildx build --target runtime --build-context sourceslock=<dir with that file> ...

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "ROS distro to release"
        required: true
        type: string
      version:
        description: "Version to tag (e.g. 1.0.0); must not already exist"
        required: true
        type: string
      runner:
        description: "Runner label(s) for the release job. It needs the self-hosted runners' disk and registry mirror."
        required: false
        default: "self-hosted"
        type: string
    secrets:
      GH_PAT:
        description: "GitHub token used by vcs import to clone private product repos"
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Shares nightly.yml's group so the two never race. Never cancelled: it pushes
# immutable :<version> tags and moves :stable.
concurrency:
  group: duatic-image-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: release/${{ inputs.ros_distro }}/${{ inputs.version }}
    permissions:
      contents: write
      packages: write
    steps:
      # Not persisted: the checkout's .git goes into the image's build stages. build_product.sh
      # names the repository after the checkout's origin remote, not after this path.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          path: caller
          persist-credentials: false

      # The checkout above takes the calling repository. job.workflow_ref names this file's
      # own repository and revision, so a caller pinning this workflow pins the factory and,
      # through FACTORY_REF, the base images it builds on.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          # Also read by scripts/image_env.sh: picks the ros2-base / ros2-dev release to build on.
          echo "FACTORY_REF=${WORKFLOW_REF#*@}" >> "$GITHUB_ENV"

      - name: Checkout the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ env.FACTORY_REF }}
          path: factory

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the runtime image
        run: |
          # shellcheck source=/dev/null
          source factory/scripts/image_env.sh
          image_env_resolve "${GITHUB_REPOSITORY#*/}" "${{ inputs.ros_distro }}"
          echo "IMAGE=$RUNTIME_REPO" >> "$GITHUB_ENV"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"

      - name: Build and push the release image
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ./factory/scripts/build_product.sh \
            --source caller \
            --ros-distro "${{ inputs.ros_distro }}" \
            --target runtime \
            --version "${{ inputs.version }}" \
            --push

      - name: Pull the just-published image (for artifact extraction)
        run: docker pull "${IMAGE}:${{ inputs.version }}"

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ inputs.version }}"
          docker run --rm "$ref" cat /etc/duatic/sources.lock.repos > sources.lock.repos
          docker run --rm "$ref" dpkg -l > packages.txt
          docker run --rm "$ref" pip3 freeze > pip-freeze.txt
          docker run --rm "$ref" bash -c \
            'source /opt/ros/$ROS_DISTRO/setup.bash && source /opt/duatic/ws/install/setup.bash && ros2 pkg list' \
            > ros2-pkg-list.txt
          docker image inspect "$ref" --format '{{index .RepoDigests 0}}' > digest.txt
          echo "Digest: $(cat digest.txt)"

      # Tags the released revision of the calling repository.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${PRODUCT}/${{ inputs.ros_distro }} ${{ inputs.version }}" \
            --notes "$(cat <<EOF
          Runtime image: \`${IMAGE}:${{ inputs.version }}\` (also tagged \`:stable\`)
          Digest: $(cat digest.txt)
          Built from \`${GITHUB_REPOSITORY}\`@\`${GITHUB_SHA}\`

          Robots pin to \`${IMAGE}:${{ inputs.version }}\` directly, or track \`${IMAGE}:stable\`.
          Reproduce this exact build: extract \`sources.lock.repos\` below and pass it to
          \`docker buildx build --target runtime --build-context sourceslock=<dir>\`
          (see https://github.com/Duatic/duatic_ros2_base_images#releases-of-product-images).
          EOF
          )" \
            sources.lock.repos packages.txt pip-freeze.txt ros2-pkg-list.txt digest.txt
